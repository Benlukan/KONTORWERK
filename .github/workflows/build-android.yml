name: Android-App bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android

      - name: Debug-APK bauen (sofort installierbar)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Release-Keystore einrichten (optional, für Play Store)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            echo "HAS_RELEASE=1" >> "$GITHUB_ENV"
          fi

      - name: Release-AAB + APK bauen (nur mit Secrets)
        if: env.HAS_RELEASE == '1'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Dateien einsammeln
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/KASSENWERK-v$VER.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "out/KASSENWERK-v$VER-playstore.aab"
            cp android/app/build/outputs/apk/release/app-release.apk "out/KASSENWERK-v$VER-release.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: KASSENWERK-android
          path: out/*
      - name: An Release anhängen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
